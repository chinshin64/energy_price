name: Android OCR UI

on:
  pull_request:
    paths:
      - 'mobile/android-ocr-uploader/**'
      - '.github/workflows/android-ocr-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/android-ocr-uploader
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test 2.5.15
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug \
            -PappVersionName=2.5.15 \
            -PappVersionCode=55

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: information-auto-recognition-v2.5.15-debug
          path: mobile/android-ocr-uploader/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
