<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>报告列表 - 证据中心</title>
    <style>
        :root {
            --bg: #f7f4ef;
            --surface: rgba(255, 255, 255, 0.9);
            --surface-strong: #ffffff;
            --line: rgba(31, 42, 68, 0.08);
            --line-strong: rgba(31, 42, 68, 0.16);
            --text: #1f2a44;
            --muted: #7d8699;
            --brand: #ff6a1a;
            --brand-deep: #dd5208;
            --brand-soft: #fff0e5;
            --blue: #315efb;
            --blue-soft: #eef3ff;
            --success: #169b62;
            --warn: #d18b00;
            --danger: #d94a45;
            --shadow-md: 0 14px 32px rgba(34, 45, 70, 0.08);
            --shadow-lg: 0 24px 60px rgba(40, 56, 85, 0.1);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --content-width: 1560px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(255, 175, 119, 0.1), transparent 28%),
                radial-gradient(circle at top right, rgba(49, 94, 251, 0.05), transparent 26%),
                linear-gradient(180deg, #faf7f2 0%, #f5f1ea 52%, #f0ebe4 100%);
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle, rgba(31, 42, 68, 0.035) 1px, transparent 1px),
                linear-gradient(120deg, rgba(255, 255, 255, 0.35), transparent 55%);
            background-size: 24px 24px, 100% 100%;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.75), transparent 92%);
            opacity: 0.22;
        }

        button, input, select, textarea { font: inherit; }
        button { border: none; background: none; }

        .app-shell {
            position: relative;
            z-index: 1;
            width: min(100%, var(--content-width));
            margin: 0 auto;
            padding: 18px 22px 32px;
        }

        .topbar {
            position: sticky;
            top: 16px;
            z-index: 20;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            grid-template-areas: "brand nav";
            align-items: center;
            gap: 18px 22px;
            padding: 18px 22px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(18px);
            box-shadow: 0 18px 42px rgba(32, 46, 77, 0.12);
        }

        .brand {
            grid-area: brand;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-mark {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #ff9f5a 0%, #ff6a1a 42%, #315efb 100%);
            box-shadow: 0 14px 28px rgba(255, 106, 26, 0.22);
        }

        .brand-copy strong {
            display: block;
            font-size: 30px;
            line-height: 1;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .top-nav {
            grid-area: nav;
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .top-nav::-webkit-scrollbar { display: none; }

        .nav-item {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 112px;
            padding: 12px 18px;
            border-radius: 999px;
            color: #566074;
            cursor: pointer;
            transition: all 0.22s ease;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
        }

        .nav-item:hover {
            background: rgba(255, 106, 26, 0.08);
            color: var(--brand-deep);
        }

        .nav-item.active {
            color: var(--brand-deep);
            background: linear-gradient(180deg, #fff6ef 0%, #ffe6d5 100%);
            box-shadow: inset 0 0 0 1px rgba(255, 106, 26, 0.08);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            font-size: 14px;
            color: var(--muted);
        }

        .breadcrumb a {
            color: var(--brand-deep);
            text-decoration: none;
        }

        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb .sep { color: var(--muted); }

        .section-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .section-title-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .section-title-group::before {
            content: "";
            width: 5px;
            height: 30px;
            border-radius: 999px;
            background: linear-gradient(180deg, #ff8d39 0%, #ff5a0a 100%);
            box-shadow: 0 10px 20px rgba(255, 106, 26, 0.24);
        }

        .section-title-group h2 {
            font-size: 34px;
            font-weight: 800;
            line-height: 1.08;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            padding: 18px 20px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.78);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow-md);
            margin-bottom: 18px;
        }

        .filter-group {
            display: grid;
            gap: 6px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
        }

        .filter-group select,
        .filter-group input {
            min-width: 140px;
            height: 40px;
            padding: 0 12px;
            border: 1px solid rgba(31, 42, 68, 0.1);
            border-radius: 12px;
            background: rgba(250, 250, 252, 0.95);
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            border-color: rgba(255, 106, 26, 0.36);
            box-shadow: 0 0 0 4px rgba(255, 106, 26, 0.08);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            height: 40px;
            padding: 0 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

        .btn-primary {
            color: #fff;
            background: linear-gradient(135deg, #ff8938 0%, #ff5a0a 100%);
            box-shadow: 0 10px 24px rgba(255, 106, 26, 0.22);
        }

        .btn-secondary {
            color: var(--text);
            border: 1px solid rgba(31, 42, 68, 0.08);
            background: rgba(248, 250, 252, 0.98);
        }

        .btn-sm {
            min-width: 56px;
            height: 32px;
            padding: 0 10px;
            font-size: 12px;
            border-radius: 10px;
        }

        .btn-danger {
            color: #fff;
            background: linear-gradient(135deg, #f06a62 0%, #da4237 100%);
            box-shadow: 0 10px 24px rgba(217, 74, 69, 0.18);
        }

        .table-wrap {
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.78);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }

        thead {
            background: linear-gradient(180deg, #fafbfc 0%, #f5f6f8 100%);
        }

        th {
            padding: 14px 16px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid var(--line);
        }

        td {
            padding: 14px 16px;
            font-size: 13px;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255, 106, 26, 0.03); }

        .td-title {
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }

        .td-actions {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .badge-passed, .badge-complete, .badge-done { background: #e6f9f0; color: #169b62; }
        .badge-partial { background: #fff8e6; color: #d18b00; }
        .badge-failed, .badge-missing { background: #fde8e7; color: #d94a45; }
        .badge-blocked { background: #f0f1f3; color: #6b7280; }
        .badge-pending, .badge-draft, .badge-in-progress { background: #eef3ff; color: #315efb; }
        .badge-none { background: #f5f5f5; color: #9ca3af; }
        .badge-high { background: #fde8e7; color: #d94a45; }
        .badge-medium { background: #fff8e6; color: #d18b00; }
        .badge-low { background: #e6f9f0; color: #169b62; }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-top: 1px solid var(--line);
            font-size: 13px;
            color: var(--muted);
        }

        .pagination-info { display: flex; align-items: center; gap: 8px; }

        .pagination-btns {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .page-btn {
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            background: rgba(248, 250, 252, 0.98);
            border: 1px solid rgba(31, 42, 68, 0.06);
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .page-btn:hover:not(:disabled) {
            background: var(--brand-soft);
            border-color: rgba(255, 106, 26, 0.2);
            color: var(--brand-deep);
        }

        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .page-btn.active {
            background: linear-gradient(135deg, #ff8938 0%, #ff5a0a 100%);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 6px 16px rgba(255, 106, 26, 0.2);
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--muted);
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.36);
            backdrop-filter: blur(4px);
            place-items: center;
        }

        .modal-overlay.open { display: grid; }

        .modal {
            width: min(420px, 92vw);
            padding: 28px;
            border-radius: 24px;
            background: #fff;
            box-shadow: var(--shadow-lg);
        }

        .modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 12px; }

        .modal p {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 14px;
            background: #fff;
            box-shadow: var(--shadow-md);
            font-size: 13px;
            font-weight: 600;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.info { border-left: 4px solid var(--blue); }

        @keyframes slideIn {
            from { transform: translateX(40px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 900px) {
            .filter-bar { flex-direction: column; }
            .filter-group select, .filter-group input { min-width: 100%; }
            .topbar { grid-template-columns: 1fr; grid-template-areas: "brand" "nav"; }
            .top-nav { justify-content: flex-start; }
            .section-title-group h2 { font-size: 24px; }
            td, th { padding: 10px 8px; font-size: 12px; }
            .td-title { max-width: 160px; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">蓝</div>
                <div class="brand-copy"><strong>风控蓝军测试系统</strong></div>
            </div>
            <nav class="top-nav">
                <a class="nav-item" href="/">测试总览</a>
                <a class="nav-item active" href="/reports.html">报告列表</a>
            </nav>
        </header>

        <div class="breadcrumb">
            <a href="/">证据中心</a>
            <span class="sep">›</span>
            <span>报告列表</span>
        </div>

        <div class="section-head">
            <div class="section-title-group">
                <div><h2>报告列表</h2></div>
            </div>
        </div>

        <div class="filter-bar">
            <div class="filter-group">
                <label>测试方式</label>
                <select id="filterMethod">
                    <option value="">全部</option>
                    <option value="page-automation">页面自动化</option>
                    <option value="background-automation">后台自动化</option>
                    <option value="traffic-template">流量自动化</option>
                </select>
            </div>
            <div class="filter-group">
                <label>平台</label>
                <select id="filterPlatform">
                    <option value="">全部</option>
                    <option value="didi-charging">小桔充电</option>
                    <option value="didi-fuel">小桔加油</option>
                    <option value="didi-energy">小桔能源</option>
                </select>
            </div>
            <div class="filter-group">
                <label>城市</label>
                <input type="text" id="filterCity" placeholder="输入城市名">
            </div>
            <div class="filter-group">
                <label>结论状态</label>
                <select id="filterStatus">
                    <option value="">全部</option>
                    <option value="passed">通过</option>
                    <option value="partial">部分</option>
                    <option value="failed">失败</option>
                    <option value="blocked">阻塞</option>
                </select>
            </div>
            <div class="filter-group">
                <label>风险等级</label>
                <select id="filterRisk">
                    <option value="">全部</option>
                    <option value="high">高</option>
                    <option value="medium">中</option>
                    <option value="low">低</option>
                    <option value="none">无</option>
                </select>
            </div>
            <div class="filter-group" style="align-self:flex-end">
                <button class="btn btn-primary" onclick="loadReports()">搜索</button>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>报告ID</th>
                        <th>标题</th>
                        <th>平台</th>
                        <th>城市数</th>
                        <th>结论</th>
                        <th>风险等级</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody"></tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display:none">
                <div class="icon">📋</div>
                <p>暂无报告数据</p>
            </div>
            <div class="pagination" id="paginationBar" style="display:none">
                <div class="pagination-info"><span id="paginationInfo"></span></div>
                <div class="pagination-btns" id="paginationBtns"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h3 id="confirmTitle">确认操作</h3>
            <p id="confirmMsg"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeConfirm()">取消</button>
                <button class="btn btn-primary" id="confirmOk">确认</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const PAGE_SIZE = 50;
        let currentPage = 1;
        let totalRecords = 0;
        const API_BASE = '/api/blue-team/reports';

        const STATUS_MAP = {
            passed: { label: '通过', cls: 'badge-passed' },
            complete: { label: '完整', cls: 'badge-complete' },
            done: { label: '完成', cls: 'badge-done' },
            partial: { label: '部分', cls: 'badge-partial' },
            failed: { label: '失败', cls: 'badge-failed' },
            missing: { label: '缺失', cls: 'badge-missing' },
            blocked: { label: '阻塞', cls: 'badge-blocked' },
            pending: { label: '待处理', cls: 'badge-pending' },
            draft: { label: '草稿', cls: 'badge-draft' },
            'in-progress': { label: '进行中', cls: 'badge-in-progress' },
            none: { label: '无', cls: 'badge-none' },
        };

        const RISK_MAP = {
            high: { label: '高风险', cls: 'badge-high' },
            medium: { label: '中风险', cls: 'badge-medium' },
            low: { label: '低风险', cls: 'badge-low' },
            none: { label: '无风险', cls: 'badge-none' },
        };

        const PLATFORM_MAP = {
            'didi-charging': '小桔充电',
            'didi-fuel': '小桔加油',
            'didi-energy': '小桔能源',
        };

        function badge(status, map) {
            var m = map || STATUS_MAP;
            var info = m[status] || { label: status, cls: 'badge-none' };
            return '<span class="badge ' + info.cls + '">' + info.label + '</span>';
        }

        function formatTime(ts) {
            if (!ts) return '-';
            var d = new Date(ts);
            var pad = function(n) { return String(n).padStart(2, '0'); };
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function escHtml(s) {
            var d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function escAttr(s) {
            return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        async function loadReports(page) {
            if (page !== undefined) currentPage = page;

            var params = new URLSearchParams();
            var method = document.getElementById('filterMethod').value;
            var platform = document.getElementById('filterPlatform').value;
            var city = document.getElementById('filterCity').value.trim();
            var status = document.getElementById('filterStatus').value;
            var risk = document.getElementById('filterRisk').value;

            if (method) params.set('method', method);
            if (platform) params.set('platform', platform);
            if (city) params.set('city', city);
            if (status) params.set('overallStatus', status);
            if (risk) params.set('riskLevel', risk);
            params.set('limit', PAGE_SIZE);
            params.set('offset', (currentPage - 1) * PAGE_SIZE);

            try {
                var resp = await fetch(API_BASE + '?' + params.toString());
                var json = await resp.json();
                if (!json.success) {
                    showToast('报告加载失败', 'error');
                    return;
                }
                var reports = json.data || [];
                totalRecords = json.meta ? json.meta.total : 0;
                renderTable(reports);
                renderPagination();
            } catch (err) {
                showToast('报告加载出错', 'error');
                renderTable([]);
                renderPagination();
            }
        }

        function renderTable(reports) {
            var tbody = document.getElementById('reportTableBody');
            var empty = document.getElementById('emptyState');
            if (!reports.length) {
                tbody.innerHTML = '';
                empty.style.display = '';
                return;
            }
            empty.style.display = 'none';
            tbody.innerHTML = reports.map(function(r) {
                var id = r.id || r.reportId || '-';
                var cities = r.cities || (r.target && r.target.cities) || [];
                var id = (r.id || r.reportId || '');
                if (/^BTR-/.test(id)) { /* keep BTR- prefixed IDs */ } else if (/^\d+$/.test(id)) { id = ''; } else { id = ''; }
                if (!id) id = '#' + (r._seq || '');
                return '<tr>' +
                    '<td>' + (id ? '<code style="font-size:12px;color:var(--brand-deep)">' + escHtml(id) + '</code>' : '-') + '</td>' +
                    '<td class="td-title" title="' + escHtml(r.title || '') + '">' + escHtml(r.title || '-') + '</td>' +
                    '<td>' + escHtml(PLATFORM_MAP[r.platform] || r.platform || '-') + '</td>' +
                    '<td>' + cities.length + '</td>' +
                    '<td>' + badge(r.overallStatus || r.conclusion) + '</td>' +
                    '<td>' + badge(r.riskLevel, RISK_MAP) + '</td>' +
                    '<td style="white-space:nowrap">' + formatTime(r.createdAt || r.startedAt) + '</td>' +
                    '<td class="td-actions">' +
                        '<button class="btn btn-secondary btn-sm" onclick="viewDetail(\'' + escAttr(id) + '\')">查看</button>' +
                        '<button class="btn btn-secondary btn-sm" onclick="downloadReport(\'' + escAttr(id) + '\')">下载</button>' +
                        '<button class="btn btn-secondary btn-sm" onclick="confirmRetest(\'' + escAttr(id) + '\',\'' + escAttr(r.title || '') + '\')">复测</button>' +
                    '</td>' +
                '</tr>';
            }).join('');
        }

        function renderPagination() {
            var bar = document.getElementById('paginationBar');
            var info = document.getElementById('paginationInfo');
            var btns = document.getElementById('paginationBtns');
            var totalPages = Math.max(1, Math.ceil(totalRecords / PAGE_SIZE));

            if (totalRecords === 0) {
                bar.style.display = 'none';
                return;
            }

            bar.style.display = '';
            var start = (currentPage - 1) * PAGE_SIZE + 1;
            var end = Math.min(currentPage * PAGE_SIZE, totalRecords);
            info.textContent = '第 ' + start + '-' + end + ' 条，共 ' + totalRecords + ' 条';

            var html = '';
            html += '<button class="page-btn" ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="loadReports(' + (currentPage - 1) + ')">上一页</button>';

            var range = getPageRange(currentPage, totalPages);
            for (var i = 0; i < range.length; i++) {
                var p = range[i];
                if (p === '...') {
                    html += '<span style="padding:0 4px;color:var(--muted)">…</span>';
                } else {
                    html += '<button class="page-btn ' + (p === currentPage ? 'active' : '') + '" onclick="loadReports(' + p + ')">' + p + '</button>';
                }
            }

            html += '<button class="page-btn" ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="loadReports(' + (currentPage + 1) + ')">下一页</button>';
            btns.innerHTML = html;
        }

        function getPageRange(current, total) {
            if (total <= 7) {
                var arr = [];
                for (var i = 1; i <= total; i++) arr.push(i);
                return arr;
            }
            var pages = [1];
            if (current > 3) pages.push('...');
            for (var j = Math.max(2, current - 1); j <= Math.min(total - 1, current + 1); j++) {
                pages.push(j);
            }
            if (current < total - 2) pages.push('...');
            pages.push(total);
            return pages;
        }

        function viewDetail(id) {
            window.location.href = '/report-detail.html?id=' + encodeURIComponent(id);
        }

        function downloadReport(id) {
            window.open(API_BASE + '/' + id + '/download?format=markdown&sanitize=true', '_blank');
        }

        var pendingRetestId = null;

        function confirmRetest(id, title) {
            pendingRetestId = id;
            document.getElementById('confirmTitle').textContent = '创建复测';
            document.getElementById('confirmMsg').textContent = '确认基于报告「' + (title || id) + '」创建复测？新报告将保留原报告的测试方式和目标范围。';
            document.getElementById('confirmModal').classList.add('open');
        }

        function closeConfirm() {
            document.getElementById('confirmModal').classList.remove('open');
            pendingRetestId = null;
        }

        document.getElementById('confirmOk').addEventListener('click', async function() {
            if (!pendingRetestId) return;
            var id = pendingRetestId;
            closeConfirm();
            try {
                var resp = await fetch(API_BASE + '/' + id + '/retest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                var json = await resp.json();
                if (json.success) {
                    showToast('报告创建成功', 'success');
                    loadReports();
                } else {
                    showToast('创建报告失败', 'error');
                }
            } catch (err) {
                showToast('创建报告出错', 'error');
            }
        });

        function showToast(msg, type) {
            var container = document.getElementById('toastContainer');
            var el = document.createElement('div');
            el.className = 'toast ' + (type || 'info');
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(function() { el.remove(); }, 4000);
        }

        loadReports();
    </script>
</body>
</html>
