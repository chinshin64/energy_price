location = /api/mobile-update/latest {
    proxy_pass http://127.0.0.1:50082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /api/mobile-update/apk/ {
    proxy_pass http://127.0.0.1:50082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 1m;
}
